name: "Run test for all packages"
description: ""
runs:
  using: "composite"
  steps:
    - name: Use wasmtime 0.21.0
      uses: mwilliamson/setup-wasmtime-action@v2
      with:
        wasmtime-version: "0.21.0"

    - name: Format and lint check
      shell: bash
      run: make check

    - name: Run all tests
      shell: bash
      run: make test-all
