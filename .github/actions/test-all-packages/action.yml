name: "Run test for all packages"
description: ""
runs:
  using: "composite"
  steps:
    - name: Setup wasmtime
      uses: mwilliamson/setup-wasmtime-action@v3
      with:
        wasmtime-version: "48.0.1"

    - name: Install cargo-machete
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-machete

    - name: Format and lint check
      shell: bash
      run: make lint

    - name: Run all tests
      shell: bash
      run: make test-all
