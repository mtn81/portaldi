[workspace]
members = ["packages/index", "packages/core", "packages/macro"]
exclude = ["packages/tests"]
resolver = "2"

[workspace.package]
version = "0.7.2" #tag:release-version
edition = "2024"
rust-version = "1.85.0"

authors = ["mtn81 <nantsuka2011@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mtn81/portaldi"

[workspace.dependencies.portaldi-core]
path = "packages/core"
version = "0.7.2" #tag:release-version

[workspace.dependencies.portaldi-macro]
path = "packages/macro"
version = "0.7.2" #tag:release-version
