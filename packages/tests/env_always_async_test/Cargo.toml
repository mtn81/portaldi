[package]
name = "env_always_async_test"
version = "0.0.0"
edition = "2021"
publish = false

# Empty table to keep this package out of any parent workspace
[workspace]

# Required by the code that portaldi macros generate.
[package.metadata.cargo-machete]
ignored = ["async-trait"]

[dependencies]
portaldi = { path = "../../index" }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
